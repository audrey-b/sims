# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}
          
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      
      - name: Install JAGS macOS
        if: runner.os == 'macOS'
        run: brew install jags
        
      - name: Install JAGS Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install jags

      - name: Install JAGS Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $url = "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.2.exe/download"
          $output = "$env:RUNNER_TEMP\JAGS-4.3.2.exe"

          curl.exe -L --fail --retry 5 -o "$output" "$url"

          $file = Get-Item $output
          Write-Host "Downloaded: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 10MB) {
            Write-Error "JAGS installer download appears invalid."
            exit 1
          }

          Start-Process -FilePath $output -ArgumentList "/S" -Wait -NoNewWindow

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          install.packages("future")  ## needed by parallel workers
           install.packages("rjags", type = "source")
        shell: Rscript {0}
        
      - name: Show R version and RNG
        run: |
          print(R.version.string)
          print(RNGkind())
          set.seed(101)
          print(.Random.seed)
        shell: Rscript {0}
        
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
